<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cəliloğlu - Daxil ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1e5631',
                        secondary: '#2ecc71',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light-mode');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light-mode');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
        }
    </style>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
</head>

<body class="min-h-screen bg-[#fafafa] dark:bg-[#121212] text-gray-800 dark:text-[#e0e0e0] transition-colors duration-300 flex flex-col">

    <!-- Minimal Navbar for Theme Toggle -->
    <nav class="bg-white dark:bg-[#121212] border-b border-gray-200 dark:border-[#333333] sticky top-0 z-50 shadow-sm dark:shadow-lg transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 sm:h-20">
                <!-- Logo -->
                <a href="/" class="flex items-center gap-2.5 group">
                    <div class="bg-[#1e5631] w-8 h-8 rounded-lg flex items-center justify-center shadow-md shadow-[#1e5631]/20 group-hover:scale-105 transition-all">
                        <span class="text-white font-bold text-xl leading-none mt-[-2px]">C</span>
                    </div>
                    <span class="font-bold text-2xl tracking-tight text-gray-900 dark:text-[#e0e0e0] group-hover:text-primary transition-colors">Cəliloğlu</span>
                </a>
                <!-- Controls -->
                <div class="flex items-center gap-4">
                    <!-- Rejim Dəyişdirici Düymə -->
                    <button id="theme-toggle" type="button"
                        class="text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-white flex flex-col items-center transition-all duration-300 group dark:hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] focus:outline-none">
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 group-hover:scale-110 transition-transform" fill="currentColor"
                            viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 group-hover:scale-110 group-hover:rotate-90 transition-all duration-500" fill="currentColor"
                            viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                                fill-rule="evenodd" clip-rule="evenodd"></path>
                        </svg>
                        <span class="text-[10px] font-medium mt-1">Rejim</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4 py-12">
        <div class="max-w-md w-full bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-xl shadow-gray-200/50 dark:shadow-[0_4px_24px_rgba(0,0,0,0.6)] p-8 sm:p-10 border border-gray-100 dark:border-[#333333] transition-all duration-300">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 dark:text-[#e0e0e0] tracking-tight mb-2">
                    Cəliloğlu</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Sistemə daxil olun</p>
            </div>

            <form id="loginForm" th:action="@{/login}" method="post" class="space-y-6">
                <div th:if="${param.error != null or error != null}" class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/40 text-red-600 dark:text-red-400 rounded-lg text-sm font-medium text-center">
                    <p>İstifadəçi adı və ya şifrə yanlışdır!</p>
                </div>
                <div th:if="${param.logout != null}" class="p-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800/40 text-green-700 dark:text-green-300 rounded-lg text-sm font-medium text-center">
                    <p>Sistemdən uğurla çıxdınız.</p>
                </div>
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-[#e0e0e0] mb-2">İstifadəçi adı və ya e-poçt</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-[#333333] bg-gray-50 dark:bg-[#121212] focus:bg-white dark:focus:bg-[#121212] transition-all outline-none text-gray-800 dark:text-[#e0e0e0] placeholder-gray-400 dark:placeholder-gray-500"
                        placeholder="İstifadəçi adınızı və ya e-poçtunuzu daxil edin">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-[#e0e0e0] mb-2">Şifrə</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-[#333333] bg-gray-50 dark:bg-[#121212] focus:bg-white dark:focus:bg-[#121212] transition-all outline-none text-gray-800 dark:text-[#e0e0e0] placeholder-gray-400 dark:placeholder-gray-500"
                        placeholder="Şifrənizi daxil edin">
                </div>

                <button type="submit"
                    class="w-full bg-[#1e5631] hover:bg-[#164326] active:scale-[0.99] text-white font-medium py-3 px-4 rounded-lg shadow-sm hover:shadow-md transition-all mt-4 cursor-pointer">
                    Daxil ol
                </button>
            </form>
        </div>
    </main>

    <script>
        // Theme Toggle Logic
        var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        var themeToggleBtn = document.getElementById('theme-toggle');

        themeToggleBtn.addEventListener('click', function () {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light-mode');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light-mode');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light-mode');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light-mode');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });
    </script>
</body>

</html>
