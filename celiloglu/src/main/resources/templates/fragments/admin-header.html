<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Vahid Admin Profil Bloku -->
    <div th:fragment="profile" class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
            <p class="text-sm font-bold text-gray-900 dark:text-[#e0e0e0]"
               th:text="${currentUserDisplayName ?: (currentUsername ?: 'İstifadəçi')}">Admin İstifadəçi</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 font-medium"
               th:text="${currentUserRoleLabel ?: 'İstifadəçi'}">Super Admin</p>
        </div>
        <div class="h-10 w-10 rounded-full bg-primary/10 flex items-center justify-center text-primary border border-primary/20 dark:border-[#333333] dark:bg-white/5 dark:text-indigo-300">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>
    </div>
</body>
</html>
